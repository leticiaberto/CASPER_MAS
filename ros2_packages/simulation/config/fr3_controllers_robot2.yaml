/**:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true

robot2:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      use_sim_time: true
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  joint_state_broadcaster:
    ros__parameters:
      type: joint_state_broadcaster/JointStateBroadcaster

  arm_controller:
    ros__parameters:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - robot2_fr3_joint1
        - robot2_fr3_joint2
        - robot2_fr3_joint3
        - robot2_fr3_joint4
        - robot2_fr3_joint5
        - robot2_fr3_joint6
        - robot2_fr3_joint7
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false